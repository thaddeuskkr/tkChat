instance-id: velocity-1
default-channel: local

require-signed-velocity: true

chat:
  max-message-length: 256
  rate-limit-messages: 5
  rate-limit-window-millis: 5000
  clear-lines: 50
  # Bounds per-player work during a storage or moderation slowdown.
  max-pending-messages-per-sender: 8
  max-message-age-millis: 5000
  # Discard delayed transport messages rather than replaying old chat.
  max-delivery-age-millis: 30000

notifications:
  # Viewers with tkchat.bypass.global_player_notifications always receive global
  # network join/leave notices and server-switch notices from every server.
  local-join: true
  local-leave: true
  global-join: false
  global-leave: false

mentions:
  enabled: true
  prefix: '@'
  highlight-format: '<color:#e5c890><bold><mention></bold></color>'
  play-sound: true
  sound: minecraft:entity.experience_orb.pickup
  sound-volume: 1.0
  sound-pitch: 1.0

item-links:
  enabled: true
  placeholders: ['<item>', '[item]']
  format: '<color:#8caaee>[<amount>x <item_name>]</color>'
  response-timeout-millis: 1500

coordinates:
  enabled: true
  placeholders: ['<coords>', '[coords]']
  # Available format placeholders: <x>, <y>, <z>, <world>, and <server>.
  format: '<color:#8caaee>[<x>, <y>, <z>]</color>'
  response-timeout-millis: 1500

mariadb:
  enabled: true
  fallback-to-memory: false
  # TKCHAT_MARIADB_URL, TKCHAT_MARIADB_USERNAME, and TKCHAT_MARIADB_PASSWORD
  # override these values, keeping production credentials out of this file.
  jdbc-url: jdbc:mariadb://127.0.0.1:3306/tkchat
  username: tkchat
  password: ''
  table-prefix: tkchat
  maximum-pool-size: 8
  minimum-idle: 2
  connection-timeout-millis: 10000
  validation-timeout-millis: 5000
  idle-timeout-millis: 600000
  max-lifetime-millis: 1800000
  connect-timeout-millis: 10000
  socket-timeout-millis: 15000
  worker-threads: 8
  max-queued-operations: 1024

rabbitmq:
  # A single Velocity process delivers locally and does not need RabbitMQ.
  enabled: false
  fallback-to-local: true
  uri: amqp://guest:guest@127.0.0.1:5672/%2f
  exchange: tkchat.events
  queue-prefix: tkchat.velocity
  publish-confirm-timeout-millis: 5000

liberty-bans:
  # Deny chat if LibertyBans cannot answer. This avoids moderation bypass during an outage.
  fail-closed: true

formats:
  # Prepended to every command response. Set to '' to disable it.
  response-prefix: '<color:#9333ea><bold>tkChat <color:#767676>»</bold><gray> '
  # /me follows the sender's active channel. Available placeholders are
  # <prefix>, <name>, <suffix>, <target> (or <channel>), and <message>.
  me: '<color:#767676>* </color><prefix><name><suffix> <message>'
  direct-incoming: '<color:#6197fa>[<color:#cccccc>You</color> <bold>←</bold></color> <color:#cccccc><name></color><color:#6197fa>]</color> <color:#767676><bold>»</bold></color> <message>'
  direct-outgoing: '<color:#6197fa>[<color:#cccccc>You</color> <bold>→</bold></color> <color:#cccccc><target></color><color:#6197fa>]</color> <color:#767676><bold>»</bold></color> <message>'
  group: '<color:#767676>[</color><color:#eebebe><target></color><color:#767676>]</color> <prefix><name><suffix> <color:#767676><bold>»</bold></color> <message>'
  broadcast: '<color:#767676>[</color><color:#ef9f76><bold>Broadcast</bold></color><color:#767676>]</color> <message>'
  chat-clear: '<gray><target> chat was cleared by <prefix><name><suffix>.</gray>'
  social-spy: '<color:#767676><bold>SS</bold> [<target>]</color> <prefix><name><suffix><color:#767676><bold>»</bold></color> <message>'
  # Join/leave announcements. Available placeholders are <name> and <server>.
  # Global messages reach the rest of the network; local messages replace them on the
  # player's current server and also fire on server switches. Join messages are not sent
  # to the joining player. Use the notifications toggles above to enable or disable them.
  global-join: '<yellow><name> joined <server></yellow>'
  global-leave: '<yellow><name> left <server></yellow>'
  join: '<yellow><name> joined the game</yellow>'
  leave: '<yellow><name> left the game</yellow>'
  # Sent once per server switch, only to viewers with
  # tkchat.bypass.global_player_notifications. Placeholders: <user> (or <name>),
  # <old_server>, and <new_server>.
  server-switch: '<yellow><user> left <old_server> and joined <new_server>.</yellow>'

channels:
- id: global
  aliases: [g]
  display-name: Global
  scope: GLOBAL
  format: '<green><bold>G</bold></green> <prefix><name><suffix> <color:#767676><bold>»</bold></color> <message>'
- id: local
  aliases: [l]
  display-name: Local
  scope: SERVER
  format: '<prefix><name><suffix> <color:#767676><bold>»</bold></color> <message>'
